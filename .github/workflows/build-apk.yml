name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - name: Install and add Android
        run: |
          pip install pillow
          python3 tools/make-icons.py
          npm install --no-audit --no-fund
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor "#06141c" --splashBackgroundColor "#06141c"
          npx cap sync android
      - name: Version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KS_B64" || { echo "Signing secrets are missing"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/jarvis.jks"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          $BT/apksigner sign --ks "$RUNNER_TEMP/jarvis.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --out jarvis.apk "$RUNNER_TEMP/aligned.apk"
          $BT/apksigner verify --print-certs jarvis.apk
          rm -f "$RUNNER_TEMP/jarvis.jks"
          sha256sum jarvis.apk | tee jarvis.apk.sha256
      - uses: actions/upload-artifact@v4
        with: {name: jarvis-apk, path: "jarvis.apk\njarvis.apk.sha256"}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" jarvis.apk jarvis.apk.sha256 --title "Jarvis app $TAG" --notes "Signed Android APK. Install: download jarvis.apk, allow installs from your browser when asked, open it. Verify with jarvis.apk.sha256." --latest
